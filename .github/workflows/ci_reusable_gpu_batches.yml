name: CI / Reusable / GPU Batches

on:
  workflow_call:
    inputs:
      layer:
        description: Layer identifier used in artifacts and summaries
        required: true
        type: string
      source_sha:
        description: Exact repository commit to execute
        required: true
        type: string
      batches:
        description: Space-separated GPU batch identifiers
        required: true
        type: string
      gpu_pool_variable:
        description: Repository variable holding the authorized GPU pool (core or Draft smoke)
        required: false
        default: COLOSSAL_GPU_POOL
        type: string
      fast_mode:
        description: Use the reduced FAST_TEST model matrix
        required: false
        default: true
        type: boolean
      timeout_minutes:
        description: Maximum duration of the complete batch set
        required: false
        default: 240
        type: number
      artifact_retention_days:
        description: Number of days to retain test reports
        required: false
        default: 14
        type: number

permissions:
  contents: read

jobs:
  run-batches:
    runs-on: colossalai-e1-h20
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      CI_SOURCE_SHA: ${{ inputs.source_sha }}
      COLOSSAL_CI_IMAGE: ${{ vars.COLOSSAL_CI_IMAGE }}
      COLOSSAL_CI_CPUS: ${{ vars.COLOSSAL_CI_CPUS || '8' }}
      COLOSSAL_CI_MEMORY: ${{ vars.COLOSSAL_CI_MEMORY || '64g' }}
      COLOSSAL_CI_SHM: ${{ vars.COLOSSAL_CI_SHM || '8g' }}
      CI_CONTAINER_SCOPE: gh-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.layer }}
      # Direct lookup is intentional: an unset smoke pool must never fall back
      # to the main pool used by Ready PRs, schedules and manual regressions.
      GPU_POOL_VARIABLE: ${{ inputs.gpu_pool_variable }}
      COLOSSAL_GPU_POOL: ${{ vars[inputs.gpu_pool_variable] }}
      CI_GPU_LOCK: ${{ vars.COLOSSAL_GPU_LOCK }}
      REQUESTED_BATCHES: ${{ inputs.batches }}
      REQUESTED_FAST_MODE: ${{ inputs.fast_mode }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Validate configuration and initialize results
        shell: bash
        run: |
          set -euo pipefail
          : "${COLOSSAL_CI_IMAGE:?Set COLOSSAL_CI_IMAGE to the validated local sha256:image-ID}"
          [[ "$COLOSSAL_CI_IMAGE" =~ ^(sha256:[0-9a-f]{64}|[a-zA-Z0-9][a-zA-Z0-9._:/-]*@sha256:[0-9a-f]{64})$ ]]
          : "${CI_GPU_LOCK:?Set COLOSSAL_GPU_LOCK to the shared CI GPU lock path}"
          case "$GPU_POOL_VARIABLE" in
            COLOSSAL_GPU_POOL) ;;
            COLOSSAL_CI_SMOKE_GPU_POOL)
              [[ "$REQUESTED_BATCHES" == "4a" ]] || {
                printf 'The Draft smoke pool may only run batch 4a.\n' >&2
                exit 1
              }
              ;;
            *) printf 'Unsupported GPU pool variable: %s\n' "$GPU_POOL_VARIABLE" >&2; exit 1 ;;
          esac
          if [[ -z "$COLOSSAL_GPU_POOL" ]]; then
            printf 'Set %s to the authorized physical GPU indices; no pool fallback is allowed.\n' "$GPU_POOL_VARIABLE" >&2
            exit 1
          fi
          [[ "$COLOSSAL_GPU_POOL" =~ ^[0-9]+(,[0-9]+)*$ ]] || {
            printf '%s must contain comma-separated physical GPU indices.\n' "$GPU_POOL_VARIABLE" >&2
            exit 1
          }
          result_dir="$RUNNER_TEMP/colossalai-${{ inputs.layer }}-${{ github.run_id }}-${{ github.run_attempt }}"
          mkdir -p "$result_dir"
          printf 'CI_RESULTS_DIR=%s\n' "$result_dir" >> "$GITHUB_ENV"

      - name: Verify the preloaded local dependency image
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          # Build on this Docker daemon, or load the approved local image tar
          # once beforehand. Missing images fail; CI never pulls or pushes.
          docker image inspect --format '{{.Id}}' "$COLOSSAL_CI_IMAGE" \
            | tee "$CI_RESULTS_DIR/image-id.txt"

      - name: Fetch the exact GitHub source commit
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CI_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0
          source_root="$(mktemp -d "$RUNNER_TEMP/colossalai-${{ inputs.layer }}-source.XXXXXX")"
          archive="$source_root/source.tar.gz"
          # Numerical acceptance reports require the real Git commit. Keep a
          # standalone shallow checkout, not a .git pointer into a host worktree.
          # Public-source fetches use no stored credentials or auth headers.
          git init --quiet "$source_root/repo"
          git -C "$source_root/repo" config core.autocrlf false
          git -C "$source_root/repo" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C "$source_root/repo" config remote.origin.promisor true
          git -C "$source_root/repo" config remote.origin.partialclonefilter blob:none
          for attempt in 1 2; do
            if timeout --signal=TERM --kill-after=10s 30s \
              git -C "$source_root/repo" -c http.version=HTTP/1.1 \
              -c credential.helper= -c http.extraHeader= fetch --depth=1 --no-tags \
              --filter=blob:none origin "$CI_SOURCE_SHA"; then
              break
            fi
            [[ "$attempt" == 1 ]] || exit 1
            printf 'Git fetch failed; retrying the same pinned SHA once.\n' >&2
          done
          [[ "$(git -C "$source_root/repo" rev-parse FETCH_HEAD)" == "$CI_SOURCE_SHA" ]]
          # Fetch only commit/tree metadata through Git. Populate the working
          # tree through the compressed archive transport used by this runner.
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 10 --max-time 240 --retry 1 --retry-max-time 260 \
            --output "$archive" \
            "https://codeload.github.com/$GITHUB_REPOSITORY/tar.gz/$CI_SOURCE_SHA"
          tar --extract --gzip --file "$archive" --directory "$source_root/repo" \
            --strip-components=1 --no-same-owner --no-same-permissions
          git -C "$source_root/repo" update-ref --no-deref HEAD "$CI_SOURCE_SHA"
          git -C "$source_root/repo" read-tree HEAD
          # Recreate blob objects locally from the archive and verify the
          # resulting tree against the real commit, without lazy downloads.
          git -C "$source_root/repo" -c protocol.allow=never \
            -c protocol.https.allow=never -c protocol.file.allow=never add --force --all
          snapshot_tree="$(git -C "$source_root/repo" write-tree)"
          commit_tree="$(git -C "$source_root/repo" rev-parse 'HEAD^{tree}')"
          if [[ "$snapshot_tree" != "$commit_tree" ]]; then
            printf 'Source archive tree %s does not match commit tree %s.\n' "$snapshot_tree" "$commit_tree" >&2
            exit 1
          fi
          [[ "$(git -C "$source_root/repo" rev-parse HEAD)" == "$CI_SOURCE_SHA" ]]
          source_status="$(git -C "$source_root/repo" -c protocol.allow=never status --porcelain)"
          if [[ -n "$source_status" ]]; then
            printf 'Source working tree differs from the pinned commit:\n%s\n' "$source_status" >&2
            exit 1
          fi
          printf 'Source commit: %s\nArchive SHA256: %s\n' \
            "$CI_SOURCE_SHA" "$(sha256sum "$archive" | cut -d ' ' -f 1)"
          printf 'COLOSSAL_REPO=%s\n' "$source_root/repo" >> "$GITHUB_ENV"

      - name: Validate the batch runner without using GPUs
        shell: bash
        run: |
          set -euo pipefail
          bash -n "$COLOSSAL_REPO/.github/scripts/ci/run_colossalai_batch.sh"
          bash -n "$COLOSSAL_REPO/.github/scripts/ci/run_container_batch.sh"
          python3 -B -m unittest discover \
            -s "$COLOSSAL_REPO/.github/scripts/ci" -p 'test_*.py' -v

      - name: Run selected GPU batches
        shell: bash
        run: |
          set -uo pipefail
          if [[ "$REQUESTED_FAST_MODE" == "true" ]]; then
            export FAST_MODE=1
          else
            export FAST_MODE=0
          fi

          status=0
          for batch in $REQUESTED_BATCHES; do
            printf '\n===== Starting batch %s =====\n' "$batch"
            if ! python3 -B "$COLOSSAL_REPO/.github/scripts/ci/run_gpu_batch.py" \
              --batch "$batch" \
              --output "$CI_RESULTS_DIR/batch-$batch" \
              --lock "$CI_GPU_LOCK" \
              --image "$COLOSSAL_CI_IMAGE"; then
              status=1
              printf 'Batch %s failed; continuing to collect the remaining results.\n' "$batch" >&2
            fi
          done
          exit "$status"

      - name: Clean up only this job's containers
        if: always() && env.COLOSSAL_REPO != ''
        timeout-minutes: 3
        shell: bash
        run: |
          python3 -B "$COLOSSAL_REPO/.github/scripts/ci/container_batch.py" \
            --cleanup-scope "$CI_CONTAINER_SCOPE"

      - name: Upload GPU test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-${{ inputs.layer }}-gpu-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_RESULTS_DIR }}
          if-no-files-found: warn
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          {
            printf '## %s GPU batches\n\n' "$REQUESTED_LAYER"
            printf -- '- Source SHA: `%s`\n' "$CI_SOURCE_SHA"
            printf -- '- Runner: `%s`\n' "$RUNNER_NAME"
            printf -- '- Runtime profile: Torch 2.13 / CUDA 13.0\n'
            printf -- '- Dependency image: `%s`\n' "$COLOSSAL_CI_IMAGE"
            printf -- '- GPU pool variable: `%s`\n' "$GPU_POOL_VARIABLE"
            printf -- '- Batches: `%s`\n\n' "$REQUESTED_BATCHES"
            find "$CI_RESULTS_DIR" -name result.json -print -exec cat {} \; 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          REQUESTED_LAYER: ${{ inputs.layer }}
