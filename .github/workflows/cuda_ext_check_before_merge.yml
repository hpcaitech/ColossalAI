name: Check CUDA Extension Build Before Merge

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'version.txt'

jobs:
  matrix_preparation:
    name: Prepare Container List
    if: github.repository == 'hpcaitech/ColossalAI'
    runs-on: [self-hosted, ubuntu-latest]
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v3

      - id: set-matrix
        run: |
          cuda_ext=$(cat .cuda_ext.json | tr '\n' ' ')
          echo "matrix=${cuda_ext}" >> $GITHUB_OUTPUT

  build:
    name: Release bdist wheels
    needs: matrix_preparation
    runs-on: [self-hosted, ubuntu-latest]
    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.matrix_preparation.outputs.matrix)}}
    container:
      image: ${{ matrix.build.cuda_image }}
      options: --rm
    env:
      CUDA_VISIBLE_DEVICES: ''
      NVIDIA_VISIBLE_DEVICES: void
      FORCE_CUDA: '1'
      COLOSSAL_CPU_ARCH: x86-64
      MAX_JOBS: '2'
    steps:
      - uses: actions/checkout@v2

      - name: Install PyTorch
        run: eval ${{ matrix.build.torch_command }}

      - name: Build wheel without a GPU
        run: |
          pip install setuptools wheel ninja packaging
          python -c "import torch; assert not torch.cuda.is_available()"
          unset TORCH_CUDA_ARCH_LIST
          BUILD_EXT=1 pip wheel --no-deps --no-build-isolation --wheel-dir dist .

      - name: Check wheel contains Ampere and Hopper kernels
        run: |
          python - <<'PY'
          import re
          import subprocess
          import tempfile
          import zipfile
          from pathlib import Path

          cuda_modules = {
              "layernorm_cuda", "moe_cuda", "fused_optim_cuda", "inference_ops_cuda",
              "scaled_masked_softmax_cuda", "scaled_upper_triangle_masked_softmax_cuda",
          }
          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as wheel, tempfile.TemporaryDirectory() as temp:
              modules = {
                  Path(name).name.split(".")[0]: name for name in wheel.namelist()
                  if name.startswith("colossalai/_C/") and name.endswith(".so")
              }
              assert set(modules) == cuda_modules | {"cpu_adam_x86"}, modules
              for name in sorted(cuda_modules):
                  binary = Path(temp) / f"{name}.so"
                  binary.write_bytes(wheel.read(modules[name]))
                  output = subprocess.check_output(["cuobjdump", "--list-elf", str(binary)], text=True)
                  arches = set(re.findall(r"\bsm_\d+[af]?\b", output))
                  assert {"sm_80", "sm_90"} <= arches, f"{name}: {sorted(arches)}"
                  print(f"{name}: {sorted(arches)}")
          PY
