name: CI / Layer 2 / Trusted PR GPU
run-name: Attention 4f + full matrix 81c2cfb0 / one H20 / ${{ github.run_id }}

# Temporary validation branch only; never merge into main.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: attention-validation-81c2cfb0
  cancel-in-progress: false

jobs:
  attention-acceptance:
    if: github.repository == 'hpcaitech/ColossalAI' && github.ref == 'refs/heads/fix/attention-validation-81c2cfb0'
    runs-on: colossalai-e1-h20
    timeout-minutes: 50
    env:
      COLOSSAL_GPU_POOL: ${{ vars.COLOSSAL_GPU_POOL }}
      CI_GPU_LOCK: ${{ vars.COLOSSAL_GPU_LOCK }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Run pinned Attention acceptance on one idle GPU
        id: acceptance
        timeout-minutes: 40
        run: python3 -B .github/scripts/ci/run_attention_acceptance.py
      - name: Clean up this run's personal container
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          name="renjie-attention-gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if docker container inspect "$name" >/dev/null 2>&1; then
            owner="$(docker inspect --format '{{index .Config.Labels "org.colossalai.owner"}}' "$name")"
            [[ "$owner" == "renjie-attention-81c2cfb0" ]]
            docker rm -f "$name"
          fi
      - name: Upload numerical reports and profiler
        if: always() && steps.acceptance.outputs.results_dir != ''
        uses: actions/upload-artifact@v7
        with:
          name: attention-81c2cfb0-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.acceptance.outputs.results_dir }}/**/*.json
            ${{ steps.acceptance.outputs.results_dir }}/**/*.xml
            ${{ steps.acceptance.outputs.results_dir }}/**/*.log
            ${{ steps.acceptance.outputs.results_dir }}/**/*.py
            ${{ steps.acceptance.outputs.results_dir }}/**/*.sh
          if-no-files-found: error
          retention-days: 14
