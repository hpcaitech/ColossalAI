name: E1 Immediate GPU on PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/e1-gpu-on-pr.yml
      - .github/scripts/e1/**
      - colossalai/**
      - tests/test_booster/test_accelerator.py
      - tests/test_booster/test_plugin/test_dp_plugin_base.py
      - tests/conftest.py
      - pytest.ini
      - requirements/**
      - setup.py

permissions:
  contents: read

concurrency:
  group: e1-immediate-gpu-h20-5
  cancel-in-progress: false

jobs:
  gpu-smoke:
    if: >-
      github.repository == 'hpcaitech/ColossalAI' &&
      github.event.pull_request.head.repo.full_name == 'hpcaitech/ColossalAI' &&
      github.event.pull_request.head.ref == 'ci/e1-runner-bootstrap' &&
      github.event.pull_request.user.login == 'richardoo-707'
    runs-on: colossalai-e1-h20
    timeout-minutes: 12
    env:
      E1_COLOSSALAI_PYTHON: /mnt/beegfs/ColossalAI/wangzhijian/envs/colossalai-torch213/bin/python
      E1_PR_RESULTS: /mnt/beegfs/ricardoo/ci/gpu-h20-5/test-results/pr-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Fetch full source from the exact PR merge commit
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          source_dir="$(mktemp -d "$RUNNER_TEMP/e1-source.XXXXXX")"
          archive="$source_dir/source.tar.gz"
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 10 --max-time 180 --retry 1 --retry-max-time 200 \
            --output "$archive" \
            "https://codeload.github.com/hpcaitech/ColossalAI/tar.gz/$GITHUB_SHA"
          tar --extract --gzip --file "$archive" --directory "$source_dir" \
            --strip-components=1 --no-same-owner --no-same-permissions
          archive_sha="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          printf 'Source commit: %s\nArchive SHA256: %s\n' "$GITHUB_SHA" "$archive_sha"
          printf 'E1_SOURCE_DIR=%s\nE1_SOURCE_ARCHIVE_SHA256=%s\n' \
            "$source_dir" "$archive_sha" >> "$GITHUB_ENV"
      - name: Test resource selection without using GPUs
        run: python3 -B -m unittest discover -s "$E1_SOURCE_DIR/.github/scripts/e1" -p test_pr_gpu.py -v
      - name: Check ColossalAI dependencies and collect selected tests without GPUs
        timeout-minutes: 2
        run: >-
          "$E1_COLOSSALAI_PYTHON" -B "$E1_SOURCE_DIR/.github/scripts/e1/colossalai_suite.py"
          --collect-only --output "$E1_PR_RESULTS-preflight"
      - name: Run ColossalAI tests on two idle GPUs
        run: python3 -B "$E1_SOURCE_DIR/.github/scripts/e1/pr_gpu.py" --suite colossalai --output "$E1_PR_RESULTS"
      - name: Record result
        if: always()
        shell: bash
        run: |
          {
            printf 'E1 ColossalAI two-GPU regression on gpu-h20-5\n\n'
            printf 'Manual resource authorization; reservation website not used.\n\n'
            if test -f "$E1_PR_RESULTS/result.json"; then
              printf '```json\n'
              cat "$E1_PR_RESULTS/result.json"
              printf '\n```\n'
            else
              printf 'GPU test did not produce a result; inspect the failed step.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
